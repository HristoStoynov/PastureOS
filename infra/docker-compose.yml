version: "3.8"
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: pastureos
      POSTGRES_PASSWORD: pastureos
      POSTGRES_DB: pastureos
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: ../backend
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://pastureos:pastureos@db:5432/pastureos

volumes:
  db-data:
